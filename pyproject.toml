[project]
name = "aid-project-risk-screening"
version = "0.1.0"
description = "An explainable aid-project screening prototype with an explicit model boundary."
requires-python = ">=3.12,<3.14"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]

[project.optional-dependencies]
ml = ["scikit-learn>=1.6,<2", "pandas>=2.2,<4", "joblib>=1.4,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
